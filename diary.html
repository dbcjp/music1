let gamen=document.getElementById('gamen');

let diary=[];
let parser = [];
let doc = [];
let entries = [];
let p="",p2="",weather="",text="",date="",weekday="",moon="";
let htmlDiary="";

function makeObject(){
    parser = new DOMParser();
    doc = parser.parseFromString(html, "text/html");
    entries = doc.querySelectorAll("p");
    
    entries.forEach(item =>{
        p = item;
        p2 = p.querySelector("span").textContent.replace("diary","");
        weather = p2.slice(p2.lastIndexOf(" ") + 1);
        p2=p2.slice(0,p2.lastIndexOf(" ")).trim();
        text = p.querySelector("span").nextSibling.textContent;
        date=p2.slice(0,p2.indexOf('('));
        weekday=p2.slice(p2.indexOf('(')+1,p2.indexOf(')'));
        moon=p2.slice(p2.indexOf('月齢')+2);
        //gamen.innerHTML = date + "<br>";
        
        diary.push({
            date: date,
            weekday: weekday,
            moon: moon,
            weather: weather,
            text: text
        });
    });
    diary=diary.sort((a,b)=> a.date.localeCompare(b.date,undefined,{numeric:true, sensitivity:"base"}));
}
makeObject();


function showDiary(){
    let title="2026-9";
    htmlDiary=`<h2> == ${title} ==</h2><br>`;
    diary.forEach((item, n) =>{
        htmlDiary+=`
        <div id="box${n}" style="display:flex; gap:5px; margin-bottom:15px;"> 
        <div style="min-width:25%;" class="dbox"> <span>${item.date}<br>(${item.weekday})<br>月齢${item.moon}<br>${item.weather}</span> </div> 
        <div> ${item.text} </div> </div>`;
    });
    gamen.innerHTML=htmlDiary;
}

showDiary();
